version: "3.9"

x-app-env: &app-env
  REDIS_URL: ${REDIS_URL}
  DATABASE_URL: ${DATABASE_URL}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    profiles:
      - local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ./collector
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  enricher:
    build:
      context: ./enricher
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bot-api:
    build:
      context: ./bot-api
    environment:
      <<: *app-env
      BOT_API_PORT: ${BOT_API_PORT:-8080}
    ports:
      - "${BOT_API_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
