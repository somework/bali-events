version: "3.9"

x-app-env: &app-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bali_events}}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    profiles:
      - local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bali_events}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  collector:
    build:
      context: ./collector
    environment:
      <<: *app-env
    depends_on:
      - redis

  enricher:
    build:
      context: ./enricher
    environment:
      <<: *app-env
    depends_on:
      - redis

  bot-api:
    build:
      context: ./bot-api
    environment:
      <<: *app-env
      BOT_API_PORT: ${BOT_API_PORT:-8080}
    ports:
      - "${BOT_API_PORT:-8080}:8080"
    depends_on:
      - redis

volumes:
  postgres-data:
  redis-data:
